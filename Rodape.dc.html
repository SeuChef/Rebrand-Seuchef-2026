<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:FILL@1&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#1F1F1F;-webkit-font-smoothing:antialiased}
a{color:#1F1F1F;text-decoration:none}
a:hover{color:#C94219}
:focus-visible{outline:3px solid #FFB72B;outline-offset:2px;border-radius:6px}
</style>
</helmet>
<footer style="background:#1F1F1F;color:#FFF3DF;padding:52px 20px 34px;font-family:Inter,system-ui,sans-serif">
  <div style="max-width:1600px;margin:0 auto">
    <div style="display:grid;grid-template-columns:{{ footCols }};gap:32px">
      <div>
        <div style="font-family:Sora,sans-serif;font-weight:800;font-size:26px;letter-spacing:-0.049em;text-transform:lowercase">seuchef<span style="color:#FFB72B">.</span></div>
        <p style="margin:12px 0 0;font-family:Inter,sans-serif;font-size:14px;line-height:1.55;color:rgba(255,243,223,0.7);max-width:270px">Simples para quem procura. Prático para quem contrata. Vagas no setor da alimentação.</p>
        <div style="display:flex;gap:10px;margin-top:18px">
          <a href="https://instagram.com/" aria-label="Instagram do seuchef" style="width:42px;height:42px;border-radius:11px;border:1px solid rgba(255,243,223,0.22);display:flex;align-items:center;justify-content:center;color:#FFF3DF;flex:none" style-hover="color:#FFB72B;border-color:#FFB72B">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true">
              <rect x="3" y="3" width="18" height="18" rx="5"></rect>
              <circle cx="12" cy="12" r="4.1"></circle>
              <circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" stroke="none"></circle>
            </svg>
          </a>
          <a href="https://facebook.com/" aria-label="Facebook do seuchef" style="width:42px;height:42px;border-radius:11px;border:1px solid rgba(255,243,223,0.22);display:flex;align-items:center;justify-content:center;color:#FFF3DF;flex:none" style-hover="color:#FFB72B;border-color:#FFB72B">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M13.6 21v-7.2h2.6l.4-3h-3V8.9c0-.9.3-1.5 1.6-1.5H16.7V4.7A22 22 0 0 0 14.4 4.5c-2.3 0-3.9 1.4-3.9 4v2.3H8v3h2.5V21h3.1z"></path>
            </svg>
          </a>
          <a href="https://api.whatsapp.com/send?phone=5511921281639" aria-label="WhatsApp do seuchef" style="width:42px;height:42px;border-radius:11px;border:1px solid rgba(255,243,223,0.22);display:flex;align-items:center;justify-content:center;color:#FFF3DF;flex:none" style-hover="color:#FFB72B;border-color:#FFB72B">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12.04 2.5A9.4 9.4 0 0 0 3.9 16.6L2.5 21.5l5.05-1.33a9.4 9.4 0 1 0 4.49-17.67zm0 1.9a7.5 7.5 0 0 1 0 15 7.5 7.5 0 0 1-3.83-1.05l-.36-.21-2.62.69.7-2.55-.22-.37A7.5 7.5 0 0 1 12.04 4.4zm-3.3 3.6c-.18 0-.46.07-.7.33-.24.26-.9.88-.9 2.13 0 1.26.9 2.47 1.03 2.64.13.18 1.77 2.82 4.32 3.83 2.12.84 2.42.67 2.86.63.44-.04 1.4-.58 1.6-1.14.2-.56.2-1.04.14-1.14-.07-.1-.24-.16-.5-.29-.26-.13-1.53-.75-1.77-.84-.24-.09-.41-.13-.59.13-.17.26-.67.87-.82 1.05-.15.18-.3.2-.55.07-.26-.13-1.1-.4-2.1-1.29-.77-.69-1.29-1.53-1.44-1.79-.15-.26-.02-.4.11-.53.12-.12.26-.31.4-.47.13-.16.17-.27.26-.45.09-.18.04-.33-.02-.46-.07-.13-.6-1.45-.82-1.98-.17-.4-.34-.4-.48-.4h-.03z"></path>
            </svg>
          </a>
        </div>
      </div>
      <sc-for list="{{ footGroups }}" as="g" hint-placeholder-count="4">
        <nav aria-label="{{ g.title }}">
          <h2 style="margin:0 0 14px;font-family:Sora,sans-serif;font-weight:700;font-size:14px;color:#FFB72B;letter-spacing:0.02em">{{ g.title }}</h2>
          <ul style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px">
            <sc-for list="{{ g.links }}" as="l" hint-placeholder-count="3">
              <li><a href="{{ l.href }}" style="font-family:Inter,sans-serif;font-size:14px;color:rgba(255,243,223,0.82)" style-hover="color:#FFB72B">{{ l.label }}</a></li>
            </sc-for>
          </ul>
        </nav>
      </sc-for>
    </div>
    <div style="margin-top:40px;padding-top:20px;border-top:1px solid rgba(255,243,223,0.14);display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;font-family:Inter,sans-serif;font-size:12.5px;color:rgba(255,243,223,0.6)">
      <span>© 2026 seuchef · Plataforma de vagas do setor da alimentação</span>
      <span style="display:flex;gap:16px">
        <a href="Institucional.dc.html#termos" style="color:rgba(255,243,223,0.6)" style-hover="color:#FFB72B">Termos de uso</a>
        <a href="Institucional.dc.html#privacidade" style="color:rgba(255,243,223,0.6)" style-hover="color:#FFB72B">Política de privacidade</a>
      </span>
    </div>
  </div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:400}}">
class Component extends DCLogic {
  state = { w: 1440 };

  componentDidMount() {
    this.onResize = () => this.setState({ w: window.innerWidth });
    this.onResize();
    window.addEventListener('resize', this.onResize);
  }
  componentWillUnmount() { window.removeEventListener('resize', this.onResize); }

  renderVals() {
    const w = this.state.w;
    const mobile = w < 760, tablet = w >= 760 && w < 1180;
    return {
      footCols: mobile ? '1fr' : (tablet ? 'repeat(2,1fr)' : '1.4fr 1fr 1fr 1fr 1fr'),
      footGroups: [
        { title: 'seuchef', links: [{ label: 'Sobre nós', href: 'Institucional.dc.html' }, { label: 'Como funciona', href: 'Como funciona.dc.html' }] },
        { title: 'Candidatos', links: [{ label: 'Como funciona', href: 'Como funciona.dc.html' }, { label: 'Encontrar vagas', href: 'Home.dc.html' }, { label: 'Área do candidato', href: 'Painel Candidato.dc.html' }, { label: 'Cadastro', href: 'Entrar e Cadastrar.dc.html?modo=cadastro' }] },
        { title: 'Empresas', links: [{ label: 'Publicar vaga', href: 'Pacotes.dc.html' }, { label: 'Planos e pacotes', href: 'Pacotes.dc.html#pacotes' }, { label: 'Assinatura mensal', href: 'Assinatura.dc.html' }, { label: 'Como funciona para empresas', href: 'Como funciona.dc.html#empresas' }, { label: 'Área da empresa', href: 'Painel Empresa.dc.html' }] },
        { title: 'Institucional', links: [{ label: 'Termos de uso', href: 'Institucional.dc.html#termos' }, { label: 'Política de privacidade', href: 'Institucional.dc.html#privacidade' }] },
        { title: 'Contato', links: [{ label: 'WhatsApp 11 92128-1639', href: 'https://api.whatsapp.com/send?phone=5511921281639' }] }
      ]
    };
  }
}
</script>
</body>
</html>
